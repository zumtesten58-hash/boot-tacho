<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Boot Nav & Tacho</title>

  <!-- Leaflet CSS für OpenStreetMap -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    /* Design-Variablen für Hell- und Dunkel-Modus */
    :root {
      --bg-color: #f8fafc;
      --card-bg: rgba(255, 255, 255, 0.9);
      --card-border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
      --accent: #0284c7;
      --accent-hover: #0369a1;
      --danger: #ef4444;
      --success: #10b981;
      --shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
    }

    body.dark-theme {
      --bg-color: #0b1120;
      --card-bg: rgba(15, 23, 42, 0.9);
      --card-border: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #7dd3fc;
      --danger: #f87171;
      --success: #34d399;
      --shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text);
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    #app {
      display: flex;
      flex-direction: column;
      width: 100vw;
      height: 100vh;
      position: relative;
    }

    /* Header Navigation Bar */
    header {
      height: 54px;
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      border-bottom: 1px solid var(--card-border);
      z-index: 1000;
    }

    .header-left, .header-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn {
      background: rgba(125, 125, 125, 0.1);
      border: 1px solid var(--card-border);
      color: var(--text);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn:active {
      transform: scale(0.96);
    }

    .btn.active {
      background: var(--accent);
      color: #ffffff;
      border-color: var(--accent);
    }

    .btn-rec.recording {
      background: var(--danger);
      color: #ffffff;
      border-color: var(--danger);
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.6; }
      100% { opacity: 1; }
    }

    .logo-container {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 16px;
      color: var(--accent);
    }

    .app-logo-img {
      height: 32px;
      max-width: 100px;
      object-fit: contain;
    }

    /* Hauptbereich Karte & Overlay */
    main {
      flex: 1;
      position: relative;
      width: 100%;
      height: calc(100vh - 54px);
    }

    #map {
      width: 100%;
      height: 100%;
      z-index: 1;
      background: var(--bg-color);
    }

    /* Klappmenü (Sidebar links) */
    #sidebar {
      position: absolute;
      top: 0;
      left: -300px;
      width: 300px;
      height: 100%;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      z-index: 2000;
      transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      border-right: 1px solid var(--card-border);
      display: flex;
      flex-direction: column;
      padding: 16px;
      box-shadow: var(--shadow);
    }

    #sidebar.open {
      left: 0;
    }

    .sidebar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--card-border);
      margin-bottom: 16px;
    }

    .module-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow-y: auto;
    }

    .module-card {
      padding: 12px;
      background: rgba(125, 125, 125, 0.08);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      font-size: 13px;
    }

    #sidebar-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.4);
      z-index: 1500;
      display: none;
    }

    #sidebar-overlay.active {
      display: block;
    }

    /* Wetter-Box Oben Rechts */
    .weather-pill {
      position: absolute;
      top: 12px;
      right: 12px;
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      border: 1px solid var(--card-border);
      padding: 6px 12px;
      border-radius: 20px;
      z-index: 500;
      font-size: 12px;
      font-weight: 600;
      box-shadow: var(--shadow);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Multi-Touch Dashboard HUD Untern */
    .hud-panel {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 24px);
      max-width: 680px;
      background: var(--card-bg);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-radius: 18px;
      border: 1px solid var(--card-border);
      padding: 10px;
      z-index: 500;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
      text-align: center;
      box-shadow: var(--shadow);
    }

    .hud-cell {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 8px 4px;
      background: rgba(125, 125, 125, 0.05);
      border-radius: 12px;
      border: 1px solid transparent;
      transition: background 0.2s, border-color 0.2s;
    }

    .hud-cell.touchable {
      cursor: pointer;
    }

    .hud-cell.touchable:active {
      background: rgba(2, 132, 199, 0.15);
      border-color: var(--accent);
    }

    .hud-label {
      font-size: 10px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .hud-value {
      font-size: 20px;
      font-weight: 800;
      color: var(--accent);
      margin: 2px 0;
    }

    .hud-unit {
      font-size: 10px;
      font-weight: 600;
      color: var(--text);
    }

    /* Modal Dialog für Fahrtenbuch */
    .modal {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.5);
      z-index: 3000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal.open {
      display: flex;
    }

    .modal-content {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      width: 100%;
      max-width: 480px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      padding: 16px;
      box-shadow: var(--shadow);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--card-border);
    }

    .modal-body {
      overflow-y: auto;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .track-item {
      padding: 10px;
      background: rgba(125, 125, 125, 0.08);
      border-radius: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Responsiv im Querformat (Handy gekippt) */
    @media (orientation: landscape) and (max-height: 500px) {
      header {
        height: 44px;
        padding: 0 8px;
      }
      main {
        height: calc(100vh - 44px);
      }
      .hud-panel {
        bottom: 6px;
        padding: 4px;
        gap: 4px;
      }
      .hud-cell {
        padding: 4px 2px;
      }
      .hud-value {
        font-size: 16px;
      }
    }
  </style>
</head>
<body>

<div id="app">
  <!-- Header Navbar -->
  <header>
    <div class="header-left">
      <button class="btn" id="btn-menu" aria-label="Menü öffnen">☰</button>
      <div class="logo-container">
        <img src="logo.png" alt="" class="app-logo-img" id="app-logo" onerror="this.style.display='none';">
        <span id="logo-text">⚓ BootNav</span>
      </div>
    </div>

    <div class="header-right">
      <button class="btn btn-rec" id="btn-rec">● REC</button>
      <button class="btn" id="btn-datasave">Datensparen: AUS</button>
      <button class="btn" id="btn-theme">🌙</button>
    </div>
  </header>

  <!-- Hauptansicht (Karte & Overlays) -->
  <main>
    <div id="map"></div>

    <!-- Live Wetter Pill -->
    <div class="weather-pill" id="weather-pill">
      <span>🌤️</span> <span id="weather-text">GPS Suche...</span>
    </div>

    <!-- Tacho / Instrumenten HUD (Klick/Touch zum Umschalten) -->
    <div class="hud-panel">
      <!-- Live Tempo -->
      <div class="hud-cell touchable" id="box-speed">
        <span class="hud-label">Tempo</span>
        <span class="hud-value" id="val-speed">0.0</span>
        <span class="hud-unit unit-toggle">kn</span>
      </div>

      <!-- Kompass COG -->
      <div class="hud-cell">
        <span class="hud-label">Kurs (COG)</span>
        <span class="hud-value" id="val-heading">---°</span>
        <span class="hud-unit">Grad</span>
      </div>

      <!-- Max Speed -->
      <div class="hud-cell touchable" id="box-maxspeed">
        <span class="hud-label">Max</span>
        <span class="hud-value" id="val-maxspeed">0.0</span>
        <span class="hud-unit unit-toggle">kn</span>
      </div>

      <!-- Durchschnitts-Speed -->
      <div class="hud-cell touchable" id="box-avgspeed">
        <span class="hud-label">Ø Tempo</span>
        <span class="hud-value" id="val-avgspeed">0.0</span>
        <span class="hud-unit unit-toggle">kn</span>
      </div>

      <!-- Beschleunigung -->
      <div class="hud-cell">
        <span class="hud-label">Beschl.</span>
        <span class="hud-value" id="val-accel">0.0</span>
        <span class="hud-unit">m/s²</span>
      </div>
    </div>
  </main>

  <!-- Klapp-Sidebar -->
  <div id="sidebar-overlay"></div>
  <div id="sidebar">
    <div class="sidebar-header">
      <h3>Navigation & Module</h3>
      <button class="btn" id="btn-close-menu">✕</button>
    </div>
    <div class="module-list" id="module-list">
      <div class="module-card">
        <strong>GPS Status:</strong> <span id="gps-status" style="color:var(--danger)">Suche...</span>
      </div>
      <div class="module-card">
        <button class="btn" id="btn-open-logbook" style="width:100%; justify-content:center;">📖 Fahrtenbuch & Export</button>
      </div>
      <!-- Hier tragen sich weitere extern geladene Module ein -->
    </div>
  </div>

  <!-- Fahrtenbuch Modal Dialog -->
  <div class="modal" id="modal-logbook">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Lokales Fahrtenbuch</h3>
        <button class="btn" id="btn-close-logbook">✕</button>
      </div>
      <div class="modal-body" id="logbook-list">
        <!-- Gespeicherte Fahrten werden hier aufgelistet -->
      </div>
      <div style="margin-top:12px; display:flex; gap:8px;">
        <input type="file" id="gpx-import-input" accept=".gpx" style="display:none;">
        <button class="btn" id="btn-import-gpx" style="flex:1;">📥 GPX Importieren</button>
      </div>
    </div>
  </div>
</div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
  /**
   * Erweiterbare Modul-Schnittstelle
   * Jedes zusätzliche Script im selben Ordner kann `window.NavApp.registerModule(...)` aufrufen.
   */
  window.NavApp = {
    modules: {},
    registerModule: function(id, moduleObj) {
      this.modules[id] = moduleObj;
      const list = document.getElementById('module-list');
      const card = document.createElement('div');
      card.className = 'module-card';
      card.innerHTML = `<strong>${moduleObj.name || id}</strong><br><small style="color:var(--text-muted);">${moduleObj.description || ''}</small>`;
      if (moduleObj.init) {
        card.style.cursor = 'pointer';
        card.onclick = () => moduleObj.init();
      }
      list.appendChild(card);
    }
  };

  // App State (Status)
  const state = {
    unit: 'kn', // 'kn' (Knoten) oder 'kmh' (km/h)
    theme: 'dark', // 'light' oder 'dark'
    dataSave: false,
    recording: false,
    speedMS: 0,
    maxSpeedMS: 0,
    speedSamples: [],
    lastSpeedMS: 0,
    lastTime: 0,
    currentTrack: [],
    savedTracks: JSON.parse(localStorage.getItem('boot_tracks') || '[]'),
    lat: null,
    lon: null
  };

  // DOM Elemente
  const btnMenu = document.getElementById('btn-menu');
  const btnCloseMenu = document.getElementById('btn-close-menu');
  const sidebar = document.getElementById('sidebar');
  const sidebarOverlay = document.getElementById('sidebar-overlay');
  const btnTheme = document.getElementById('btn-theme');
  const btnDataSave = document.getElementById('btn-datasave');
  const btnRec = document.getElementById('btn-rec');
  const btnOpenLogbook = document.getElementById('btn-open-logbook');
  const btnCloseLogbook = document.getElementById('btn-close-logbook');
  const modalLogbook = document.getElementById('modal-logbook');

  // Multi-Touch Event Listener für Tempo-Einheiten (Klick/Touch auf Tempo-Felder)
  ['box-speed', 'box-maxspeed', 'box-avgspeed'].forEach(id => {
    document.getElementById(id).onclick = () => {
      state.unit = state.unit === 'kn' ? 'kmh' : 'kn';
      document.querySelectorAll('.unit-toggle').forEach(el => el.innerText = state.unit);
      renderUI();
    };
  });

  // Sidebar Steuerung
  function toggleSidebar() {
    sidebar.classList.toggle('open');
    sidebarOverlay.classList.toggle('active');
  }
  btnMenu.onclick = toggleSidebar;
  btnCloseMenu.onclick = toggleSidebar;
  sidebarOverlay.onclick = toggleSidebar;

  // Theme Wechsel (Hell / Dunkel)
  btnTheme.onclick = () => {
    state.theme = state.theme === 'dark' ? 'light' : 'dark';
    document.body.classList.toggle('dark-theme', state.theme === 'dark');
    btnTheme.innerText = state.theme === 'dark' ? '🌙' : '☀️';
  };
  document.body.classList.add('dark-theme');

  // Datenspar-Modus Toggle (Löscht geladene Kartenkacheln NICHT!)
  btnDataSave.onclick = () => {
    state.dataSave = !state.dataSave;
    btnDataSave.classList.toggle('active', state.dataSave);
    btnDataSave.innerText = state.dataSave ? 'Datensparen: EIN' : 'Datensparen: AUS';
  };

  // Karte initialisieren (Leaflet)
  const map = L.map('map', { zoomControl: false }).setView([51.1657, 10.4515], 6);
  const tileLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '© OpenStreetMap'
  }).addTo(map);

  const userMarker = L.marker([0, 0]).addTo(map);
  const trackPolyline = L.polyline([], { color: '#0284c7', weight: 4 }).addTo(map);

  // Einheiten Umrechner
  function convertSpeed(ms) {
    if (state.unit === 'kn') return (ms * 1.94384).toFixed(1);
    return (ms * 3.6).toFixed(1);
  }

  function renderUI() {
    document.getElementById('val-speed').innerText = convertSpeed(state.speedMS);
    document.getElementById('val-maxspeed').innerText = convertSpeed(state.maxSpeedMS);
    
    // Durchschnitt berechnen
    if (state.speedSamples.length > 0) {
      const avgMS = state.speedSamples.reduce((a, b) => a + b, 0) / state.speedSamples.length;
      document.getElementById('val-avgspeed').innerText = convertSpeed(avgMS);
    } else {
      document.getElementById('val-avgspeed').innerText = '0.0';
    }
  }

  // Öffentliche Wetter API Abfrage (Open-Meteo)
  let lastWeatherFetch = 0;
  async function fetchWeather(lat, lon) {
    if (state.dataSave || Date.now() - lastWeatherFetch < 600000) return;
    try {
      lastWeatherFetch = Date.now();
      const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`);
      const data = await res.json();
      if (data && data.current_weather) {
        const temp = data.current_weather.temperature;
        const windKn = (data.current_weather.windspeed * 0.539957).toFixed(1);
        document.getElementById('weather-text').innerText = `${temp}°C | Wind: ${windKn} kn`;
      }
    } catch (e) {
      document.getElementById('weather-text').innerText = 'Wetter N/A';
    }
  }

  // GPS Live Tracking (0 KB Datenverbrauch)
  if ('geolocation' in navigator) {
    navigator.geolocation.watchPosition(
      (pos) => {
        document.getElementById('gps-status').innerText = 'Aktiv';
        document.getElementById('gps-status').style.color = 'var(--success)';

        const lat = pos.coords.latitude;
        const lon = pos.coords.longitude;
        const speedMS = pos.coords.speed || 0;
        const heading = pos.coords.heading;
        const now = pos.timestamp;

        state.lat = lat;
        state.lon = lon;
        state.speedMS = speedMS;

        if (speedMS > state.maxSpeedMS) state.maxSpeedMS = speedMS;
        if (speedMS > 0.5) state.speedSamples.push(speedMS);

        // Beschleunigungs-Berechnung
        if (state.lastTime && now > state.lastTime) {
          const dt = (now - state.lastTime) / 1000;
          const dv = speedMS - state.lastSpeedMS;
          document.getElementById('val-accel').innerText = (dt > 0 ? (dv / dt) : 0).toFixed(2);
        }

        state.lastSpeedMS = speedMS;
        state.lastTime = now;

        renderUI();

        if (heading !== null && !isNaN(heading)) {
          document.getElementById('val-heading').innerText = `${Math.round(heading)}°`;
        } else {
          document.getElementById('val-heading').innerText = '---°';
        }

        const latLng = [lat, lon];
        userMarker.setLatLng(latLng);
        map.panTo(latLng);

        // Aufzeichnung wenn REC aktiv
        if (state.recording) {
          state.currentTrack.push({ lat, lon, speed: speedMS, time: new Date().toISOString() });
          trackPolyline.addLatLng(latLng);
        }

        fetchWeather(lat, lon);
      },
      (err) => {
        document.getElementById('gps-status').innerText = 'Fehler / Keines';
        document.getElementById('gps-status').style.color = 'var(--danger)';
      },
      { enableHighAccuracy: true, maximumAge: 1000, timeout: 10000 }
    );
  }

  // REC (Aufzeichnung) Start / Stop
  btnRec.onclick = () => {
    state.recording = !state.recording;
    btnRec.classList.toggle('recording', state.recording);
    btnRec.innerText = state.recording ? '■ STOP' : '● REC';

    if (!state.recording && state.currentTrack.length > 0) {
      // Fahrt speichern
      const trackObj = {
        id: Date.now(),
        date: new Date().toLocaleString(),
        points: state.currentTrack
      };
      state.savedTracks.push(trackObj);
      localStorage.setItem('boot_tracks', JSON.stringify(state.savedTracks));
      state.currentTrack = [];
      alert('Fahrt erfolgreich im lokalen Speicher gesichert!');
    }
  };

  // Fahrtenbuch Modal & Liste
  function renderLogbook() {
    const listEl = document.getElementById('logbook-list');
    listEl.innerHTML = '';
    if (state.savedTracks.length === 0) {
      listEl.innerHTML = '<div style="text-align:center; padding:16px; color:var(--text-muted);">Keine Aufzeichnungen vorhanden</div>';
      return;
    }
    state.savedTracks.forEach(tr => {
      const item = document.createElement('div');
      item.className = 'track-item';
      item.innerHTML = `
        <div>
          <strong>${tr.date}</strong><br>
          <small style="color:var(--text-muted);">${tr.points.length} Punkte</small>
        </div>
        <div style="display:flex; gap:6px;">
          <button class="btn" onclick="exportGPX(${tr.id})">💾 GPX</button>
          <button class="btn" style="color:var(--danger);" onclick="deleteTrack(${tr.id})">🗑️</button>
        </div>
      `;
      listEl.appendChild(item);
    });
  }

  btnOpenLogbook.onclick = () => {
    renderLogbook();
    modalLogbook.classList.add('open');
  };
  btnCloseLogbook.onclick = () => modalLogbook.classList.remove('open');

  // GPX Export Funktion
  window.exportGPX = function(id) {
    const tr = state.savedTracks.find(t => t.id === id);
    if (!tr) return;
    let gpx = `<?xml version="1.0" encoding="UTF-8"?>\n<gpx version="1.1" creator="BootNav">\n<trk><name>Fahrt ${tr.date}</name><trkseg>\n`;
    tr.points.forEach(p => {
      gpx += `  <trkpt lat="${p.lat}" lon="${p.lon}"><time>${p.time}</time><speed>${p.speed}</speed></trkpt>\n`;
    });
    gpx += `</trkseg></trk>\n</gpx>`;

    const blob = new Blob([gpx], { type: 'application/gpx+xml' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `track_${id}.gpx`;
    a.click();
  };

  window.deleteTrack = function(id) {
    state.savedTracks = state.savedTracks.filter(t => t.id !== id);
    localStorage.setItem('boot_tracks', JSON.stringify(state.savedTracks));
    renderLogbook();
  };

  // GPX Import Handler
  document.getElementById('btn-import-gpx').onclick = () => document.getElementById('gpx-import-input').click();
  document.getElementById('gpx-import-input').onchange = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (evt) => {
      const parser = new DOMParser();
      const xmlDoc = parser.parseFromString(evt.target.result, "text/xml");
      const pts = xmlDoc.getElementsByTagName("trkpt");
      const importedPoints = [];
      for (let i = 0; i < pts.length; i++) {
        importedPoints.push({
          lat: parseFloat(pts[i].getAttribute("lat")),
          lon: parseFloat(pts[i].getAttribute("lon")),
          speed: 0,
          time: new Date().toISOString()
        });
      }
      if (importedPoints.length > 0) {
        state.savedTracks.push({
          id: Date.now(),
          date: `Importiert: ${file.name}`,
          points: importedPoints
        });
        localStorage.setItem('boot_tracks', JSON.stringify(state.savedTracks));
        renderLogbook();
        alert('GPX-Datei erfolgreich importiert!');
      }
    };
    reader.readAsText(file);
  };
</script>
