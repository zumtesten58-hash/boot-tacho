<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Boot-Tacho & Navigation</title>

  <!-- Leaflet CSS für die OpenStreetMap Karte -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.85);
      --accent: #38bdf8;
      --text: #f8fafc;
      --text-dim: #94a3b8;
      --danger: #ef4444;
      --border: #334155;
    }

    /* Nachtmodus (Rotlicht-Design für die Nachtsicht) */
    body.night-mode {
      --bg-color: #000000;
      --card-bg: rgba(20, 0, 0, 0.9);
      --accent: #ff3333;
      --text: #ff6666;
      --text-dim: #990000;
      --border: #440000;
      filter: sepia(100%) hue-rotate(300deg) saturate(400%);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text);
    }

    #app-container {
      display: flex;
      flex-direction: column;
      width: 100vw;
      height: 100vh;
      position: relative;
    }

    /* Top-Header Navigation */
    header {
      height: 56px;
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      border-bottom: 1px solid var(--border);
      z-index: 1000;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-icon {
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 24px;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 6px;
    }

    .btn-icon:active {
      background: var(--border);
    }

    .app-logo {
      height: 36px;
      max-width: 120px;
      object-fit: contain;
    }

    .logo-fallback {
      font-weight: bold;
      font-size: 18px;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .header-actions {
      display: flex;
      gap: 8px;
    }

    .toggle-btn {
      background: var(--border);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
    }

    .toggle-btn.active {
      background: var(--accent);
      color: #0f172a;
    }

    /* Hauptbereich Layout: Karte & Overlay */
    main {
      flex: 1;
      position: relative;
      width: 100%;
      height: calc(100vh - 56px);
    }

    #map {
      width: 100%;
      height: 100%;
      z-index: 1;
      background: #0f172a;
    }

    /* Klappmenü (Sidebar Links) */
    #sidebar {
      position: absolute;
      top: 0;
      left: -280px;
      width: 280px;
      height: 100%;
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      z-index: 2000;
      transition: left 0.3s ease;
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 16px;
    }

    #sidebar.open {
      left: 0;
    }

    .sidebar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }

    .module-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow-y: auto;
    }

    .module-item {
      padding: 12px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 8px;
      border: 1px solid var(--border);
      cursor: pointer;
    }

    #overlay-sidebar {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.5);
      z-index: 1500;
      display: none;
    }

    #overlay-sidebar.active {
      display: block;
    }

    /* Dashboard Instrumente Overlay (HUD) */
    .hud-panel {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 32px);
      max-width: 600px;
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      border-radius: 16px;
      border: 1px solid var(--border);
      padding: 12px;
      z-index: 500;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      text-align: center;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }

    .hud-box {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 6px;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 8px;
    }

    .hud-box.clickable {
      cursor: pointer;
    }

    .hud-box.clickable:active {
      background: rgba(56, 189, 248, 0.2);
    }

    .hud-label {
      font-size: 10px;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .hud-value {
      font-size: 22px;
      font-weight: 800;
      color: var(--accent);
      margin: 2px 0;
    }

    .hud-unit {
      font-size: 10px;
      color: var(--text);
    }

    /* Wetter Info-Box */
    .weather-box {
      position: absolute;
      top: 16px;
      right: 16px;
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border);
      padding: 8px 12px;
      border-radius: 10px;
      z-index: 500;
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Responsives Verhalten bei Querformat (Handy gekippt) */
    @media (orientation: landscape) and (max-height: 500px) {
      header {
        height: 44px;
      }
      main {
        height: calc(100vh - 44px);
      }
      .hud-panel {
        bottom: 8px;
        padding: 6px;
      }
      .hud-value {
        font-size: 18px;
      }
    }
  </style>
</head>
<body>

<div id="app-container">
  <!-- Header Navbar -->
  <header>
    <div class="header-left">
      <button class="btn-icon" id="btn-menu">☰</button>
      <!-- Logo Versuch mit Fallback falls logo.png nicht existiert -->
      <img src="logo.png" alt="Logo" class="app-logo" id="app-logo" onerror="this.style.display='none'; document.getElementById('logo-fallback').style.display='flex';">
      <div class="logo-fallback" id="logo-fallback" style="display: none;">
        <span>⚓</span> BootNav
      </div>
    </div>
    
    <div class="header-actions">
      <button class="toggle-btn" id="btn-datasave">Datensparen: AUS</button>
      <button class="toggle-btn" id="btn-night">Nacht</button>
    </div>
  </header>

  <!-- Hauptinhalt (Karte + Overlay) -->
  <main>
    <div id="map"></div>

    <!-- Wetteranzeige (Open-Meteo API) -->
    <div class="weather-box" id="weather-box">
      <span>Wetter:</span>
      <strong id="weather-val">Warte auf GPS...</strong>
    </div>

    <!-- Tacho & Instrumente Overlay -->
    <div class="hud-panel">
      <!-- Speed (Klickbar für Einheiten-Wechsel) -->
      <div class="hud-box clickable" id="box-speed">
        <span class="hud-label">Tempo</span>
        <span class="hud-value" id="val-speed">0.0</span>
        <span class="hud-unit" id="unit-speed">kn</span>
      </div>

      <!-- Kurs / Kompass -->
      <div class="hud-box">
        <span class="hud-label">Kurs (COG)</span>
        <span class="hud-value" id="val-heading">---°</span>
        <span class="hud-unit">Grad</span>
      </div>

      <!-- Max Geschwindigkeit -->
      <div class="hud-box">
        <span class="hud-label">Max</span>
        <span class="hud-value" id="val-maxspeed">0.0</span>
        <span class="hud-unit" id="unit-maxspeed">kn</span>
      </div>

      <!-- Beschleunigung -->
      <div class="hud-box">
        <span class="hud-label">Beschl.</span>
        <span class="hud-value" id="val-accel">0.0</span>
        <span class="hud-unit">m/s²</span>
      </div>
    </div>
  </main>

  <!-- Sidebar & Overlay -->
  <div id="overlay-sidebar"></div>
  <div id="sidebar">
    <div class="sidebar-header">
      <h3>Module & Tools</h3>
      <button class="btn-icon" id="btn-close-menu">✕</button>
    </div>
    <div class="module-list" id="module-list">
      <div class="module-item">
        <strong>GPS-Status:</strong> <span id="gps-status" style="color: #ef4444;">Inaktiv</span>
      </div>
      <!-- Hier tragen sich neue Module automatisch ein -->
    </div>
  </div>
</div>

<!-- Leaflet JS für Kartenansicht -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
  /**
   * Modul-System Architektur
   * Ermöglicht das spätere Hinzufügen externer JS-Dateien im selben Ordner.
   */
  window.NavApp = {
    modules: {},
    registerModule: function(id, moduleObj) {
      this.modules[id] = moduleObj;
      const list = document.getElementById('module-list');
      const item = document.createElement('div');
      item.className = 'module-item';
      item.innerHTML = `<strong>${moduleObj.name || id}</strong><br><small>${moduleObj.description || ''}</small>`;
      item.onclick = () => { if(moduleObj.init) moduleObj.init(); };
      list.appendChild(item);
    }
  };

  // Anwendungs-Zustand (State)
  const state = {
    unit: 'kn', // 'kn' oder 'kmh'
    dataSave: false,
    nightMode: false,
    currentSpeedMS: 0,
    maxSpeedMS: 0,
    lastSpeedMS: 0,
    lastTimestamp: 0,
    lat: null,
    lon: null
  };

  // DOM Elemente
  const btnMenu = document.getElementById('btn-menu');
  const btnCloseMenu = document.getElementById('btn-close-menu');
  const sidebar = document.getElementById('sidebar');
  const overlaySidebar = document.getElementById('overlay-sidebar');
  const btnNight = document.getElementById('btn-night');
  const btnDataSave = document.getElementById('btn-datasave');
  const boxSpeed = document.getElementById('box-speed');

  // Klappmenü Steuerung
  function toggleSidebar() {
    sidebar.classList.toggle('open');
    overlaySidebar.classList.toggle('active');
  }
  btnMenu.onclick = toggleSidebar;
  btnCloseMenu.onclick = toggleSidebar;
  overlaySidebar.onclick = toggleSidebar;

  // Nachtmodus Toggle
  btnNight.onclick = () => {
    state.nightMode = !state.nightMode;
    document.body.classList.toggle('night-mode', state.nightMode);
    btnNight.classList.toggle('active', state.nightMode);
  };

  // Datenspar-Modus Toggle
  btnDataSave.onclick = () => {
    state.dataSave = !state.dataSave;
    btnDataSave.classList.toggle('active', state.dataSave);
    btnDataSave.innerText = state.dataSave ? 'Datensparen: EIN' : 'Datensparen: AUS';
    
    if (state.dataSave) {
      if (mapTileLayer) map.removeLayer(mapTileLayer);
    } else {
      if (mapTileLayer) mapTileLayer.addTo(map);
    }
  };

  // Einheiten umschalten (Klick auf Speed Box)
  boxSpeed.onclick = () => {
    state.unit = state.unit === 'kn' ? 'kmh' : 'kn';
    document.getElementById('unit-speed').innerText = state.unit;
    document.getElementById('unit-maxspeed').innerText = state.unit;
    updateUI();
  };

  // Karte initialisieren (Leaflet / OpenStreetMap)
  const map = L.map('map', { zoomControl: false }).setView([51.1657, 10.4515], 6);
  let mapTileLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '© OpenStreetMap'
  }).addTo(map);

  // Position-Marker auf der Karte
  const userMarker = L.marker([0, 0]).addTo(map);

  // Umrechnungen
  function convertSpeed(ms) {
    if (state.unit === 'kn') return (ms * 1.94384).toFixed(1); // m/s zu Knoten
    return (ms * 3.6).toFixed(1); // m/s zu km/h
  }

  function updateUI() {
    document.getElementById('val-speed').innerText = convertSpeed(state.currentSpeedMS);
    document.getElementById('val-maxspeed').innerText = convertSpeed(state.maxSpeedMS);
  }

  // Öffentliche Wetter API Abfrage (Open-Meteo - Kostenlos & Anonym)
  let lastWeatherFetch = 0;
  async function fetchWeather(lat, lon) {
    // Nur alle 10 Minuten abfragen oder bei aktivierten Daten sparen gar nicht neu laden
    if (state.dataSave || Date.now() - lastWeatherFetch < 600000) return;
    try {
      lastWeatherFetch = Date.now();
      const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`);
      const data = await res.json();
      if (data && data.current_weather) {
        const temp = data.current_weather.temperature;
        const wind = (data.current_weather.windspeed * 0.539957).toFixed(1); // km/h zu Knoten
        document.getElementById('weather-val').innerText = `${temp}°C | Wind: ${wind} kn`;
      }
    } catch (e) {
      document.getElementById('weather-val').innerText = 'Wetter N/A';
    }
  }

  // GPS Tracking via Browser Geolocation API (0 KB Datenverbrauch)
  if ('geolocation' in navigator) {
    document.getElementById('gps-status').innerText = 'Suche Signal...';
    document.getElementById('gps-status').style.color = '#f59e0b';

    navigator.geolocation.watchPosition(
      (pos) => {
        document.getElementById('gps-status').innerText = 'Aktiv';
        document.getElementById('gps-status').style.color = '#10b981';

        const lat = pos.coords.latitude;
        const lon = pos.coords.longitude;
        const speedMS = pos.coords.speed || 0; // m/s vom GPS
        const heading = pos.coords.heading;
        const now = pos.timestamp;

        state.lat = lat;
        state.lon = lon;

        // Maximalgeschwindigkeit aktualisieren
        if (speedMS > state.maxSpeedMS) state.maxSpeedMS = speedMS;

        // Beschleunigung berechnen (a = delta_v / delta_t)
        if (state.lastTimestamp && now > state.lastTimestamp) {
          const dt = (now - state.lastTimestamp) / 1000; // in Sekunden
          const dv = speedMS - state.lastSpeedMS;
          const accel = (dv / dt).toFixed(2);
          document.getElementById('val-accel').innerText = accel;
        }

        state.currentSpeedMS = speedMS;
        state.lastSpeedMS = speedMS;
        state.lastTimestamp = now;

        // UI Anzeigen aktualisieren
        updateUI();

        if (heading !== null && !isNaN(heading)) {
          document.getElementById('val-heading').innerText = `${Math.round(heading)}°`;
        } else {
          document.getElementById('val-heading').innerText = '---°';
        }

        // Kartenposition anpassen
        const latLng = [lat, lon];
        userMarker.setLatLng(latLng);
        map.panTo(latLng);

        // Wetter für aktuelle Position abfragen
        fetchWeather(lat, lon);
      },
      (err) => {
        document.getElementById('gps-status').innerText = 'Fehler / Keines';
        document.getElementById('gps-status').style.color = '#ef4444';
      },
      {
        enableHighAccuracy: true,
        maximumAge: 1000,
        timeout: 10000
      }
    );
  } else {
    document.getElementById('gps-status').innerText = 'Nicht unterstützt';
  }
</script>

</body>
</html>
